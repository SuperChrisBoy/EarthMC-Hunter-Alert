plugins { id 'net.fabricmc.fabric-loom' version '1.17.9' }
version = project.mod_version
group = 'net.earthmc.hunteralert'
base { archivesName = "earthmc-hunter-alert-${project.minecraft_version}" }
repositories {
    mavenCentral()
    maven { url = 'https://maven.terraformersmc.com/releases/' }
    maven { url = 'https://api.modrinth.com/maven' }
    maven { url = 'https://chocolateminecraft.com/maven/' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    compileOnly "maven.modrinth:emcmap-addon:${project.addon_version}"
    if (project.hasProperty('withAddon')) runtimeOnly "maven.modrinth:emcmap-addon:${project.addon_version}"
    if (project.hasProperty('withAddon') || project.hasProperty('withMinimap')) runtimeOnly 'maven.modrinth:xaeros-minimap:kWf58HtH'
    if (project.hasProperty('withAddon')) runtimeOnly 'maven.modrinth:xaeros-world-map:IYPINJuw'
    if (project.hasProperty('withAddon') || project.hasProperty('withMinimap')) runtimeOnly 'xaero.lib:xaerolib-fabric-26.1.2:1.7.3'
    compileOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    if (project.hasProperty('withModMenu')) runtimeOnly "com.terraformersmc:modmenu:18.0.0-beta.1"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
java { sourceCompatibility = JavaVersion.VERSION_25; targetCompatibility = JavaVersion.VERSION_25; withSourcesJar() }
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = 25 }
test { useJUnitPlatform() }
loom { runs { client { if (project.hasProperty('smoke')) { vmArg '-Dhunteralert.smoke=true'; runDir 'run/smoke' } } } }
def resourceVersion = project.version.toString()
processResources {
    inputs.property 'version', resourceVersion
    filesMatching('fabric.mod.json') { expand(version: resourceVersion) }
}
